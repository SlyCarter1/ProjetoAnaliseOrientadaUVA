
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | EduMais Connect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <main class="login-container">

        <a href="index.html" class="logo login-logo">
            ✦ EduMais <span>Connect</span>
        </a>

        <div class="login-card">

            <div class="login-icon">🎓</div>

            <h1>Crie sua conta!</h1>

            <p class="login-description">
                Preencha seus dados para fazer parte da EduMais.
            </p>

            <form id="cadastroForm" novalidate>

                <label for="perfil">Tipo de acesso</label>

<select id="perfil" required>
    <option value="aluno">Aluno</option>
    <option value="equipe">Equipe da ONG</option>
</select>

<label for="nome">Nome completo</label>
<input
    type="text"
    id="nome"
    placeholder="Digite seu nome completo"
    autocomplete="name"
    required
>

<label for="email">E-mail</label>
<input
    type="email"
    id="email"
    placeholder="Digite seu e-mail"
    autocomplete="email"
    required
>


                <label for="nascimento">Data de nascimento</label>
                <input
                    type="date"
                    id="nascimento"
                    required
                >

                <label for="telefone">Telefone</label>
                <input
                    type="tel"
                    id="telefone"
                    placeholder="(22) 99999-9999"
                    autocomplete="tel"
                    required
                >

<div id="responsavelFields" style="display: none;">

    <label for="nomeResponsavel">Nome do responsável</label>
    <input
        type="text"
        id="nomeResponsavel"
        placeholder="Digite o nome do responsável"
    >

    <label for="telefoneResponsavel">Telefone do responsável</label>
    <input
        type="tel"
        id="telefoneResponsavel"
        placeholder="(22) 99999-9999"
    >

</div>


                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                    autocomplete="new-password"
                    required
                >

                <label for="confirmarSenha">Confirmar senha</label>
                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Digite sua senha novamente"
                    autocomplete="new-password"
                    required
                >

                <button type="submit" class="login-submit">
                    Criar minha conta
                </button>

                <p id="cadastroMessage" role="status"></p>

            </form>

            <a href="login.html" class="back-link">
                Já possui uma conta? Faça login
            </a>

            <a href="index.html" class="back-link">
                ← Voltar para a página inicial
            </a>

        </div>

        <p class="login-footer">
            Educação, inclusão e oportunidades para todos.
        </p>

    </main>

    <script src="cadastro.js"></script>

</body>
</html>
