
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | EduMais Connect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <main class="login-container">

        <a href="index.html" class="logo login-logo">
            ✦ EduMais <span>Connect</span>
        </a>

        <div class="login-card">

            <div class="login-icon">🎓</div>

            <h1>Bem-vindo de volta!</h1>

            <p class="login-description">
                Entre na sua conta para acessar a plataforma.
            </p>

            <form id="loginForm">

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="username"
                    required
                >

                <label for="password">Senha</label>

                <div class="password-container">
                    <input
                        type="password"
                        id="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="show-password"
                    >
                        Mostrar
                    </button>
                </div>

                <button type="submit" class="login-submit">
                    Entrar na plataforma
                </button>

                <p id="loginMessage" role="status"></p>

            </form>

            
<a href="cadastro.html" class="back-link">
    Não possui uma conta? Cadastre-se
</a>

<a href="index.html" class="back-link">
    ← Voltar para a página inicial
</a>


        </div>

        <p class="login-footer">
            Educação, inclusão e oportunidades para todos.
        </p>

    </main>

    <script src="login.js"></script>

</body>
</html>
